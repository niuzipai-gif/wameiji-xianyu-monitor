[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cd-crossborder-monitor"
version = "3.0.0"
description = "Personal CD cross-border price gap monitoring and review assistant. Aligned with ai-goofish-monitor architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0",
    "openai>=1.40",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "requests>=2.31",
    "jinja2>=3.1",
    "aiofiles>=23.2",
    "httpx>=0.27",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "coverage>=7.4",
]
browser = [
    "playwright>=1.48",
    "Pillow>=10.0",
    "pyzbar>=0.1.9",
    "qrcode>=7.4",
    "python-socks>=2.0",
]
all = [
    "playwright>=1.48",
    "Pillow>=10.0",
    "pyzbar>=0.1.9",
    "qrcode>=7.4",
    "python-socks>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "coverage>=7.4",
]

[project.scripts]
cd-monitor = "cd_monitor.cli:main"
cd-monitor-web = "cd_monitor.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
    "live: real traffic smoke tests that require real credentials and external services",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "src/cd_monitor/infrastructure/external/ai_handler.py",
    "src/cd_monitor/infrastructure/external/ai_message_builder.py",
    "src/cd_monitor/infrastructure/external/ai_response_parser.py",
    "src/cd_monitor/infrastructure/external/ai_request_compat.py",
    "src/cd_monitor/web/routers/*",
    "src/cd_monitor/services/scraper/*",
]
