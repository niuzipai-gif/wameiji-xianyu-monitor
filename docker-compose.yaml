# docker-compose.yaml — WAMEIJI-XIANYU 监控平台
# 与 ai-goofish-monitor 的 docker-compose 思路对齐：1 个 app 服务 + 数据卷挂载

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: wameiji-xianyu:latest
    container_name: wameiji-xianyu-app
    init: true
    restart: unless-stopped
    ports:
      - "9890:9890"
    env_file:
      - .env
    environment:
      RUNNING_IN_DOCKER: "true"
      CD_DB_PATH: /var/lib/cd_monitor/cd_monitor.db
      CD_DB: /var/lib/cd_monitor/cd_monitor.db  # for scripts
      STATE_FILE: /app/data/xianyu_state.json
      ACCOUNT_STATE_DIR: /app/data/state
      CD_SNAPSHOT_DIR: /app/data/snapshots
      CD_SCREENSHOT_DIR: /app/data/screenshots
      CD_IMAGE_DIR: /app/data/images
      SERVER_PORT: "9890"
      SCRAPER_INTERVAL: "900"
      CD_DATA_DIR: /app/data
    volumes:
      - ./.env:/app/.env:ro
      - ./web:/app/web
      - ./data:/app/data
      - ./src:/app/src
      - wameiji_db:/var/lib/cd_monitor
      - ./state:/app/state
      - ./logs:/app/logs
      - ./jsonl:/app/jsonl
      - ./price_history:/app/price_history
      - ./prompts:/app/prompts:ro
    # Browser collection stays on the host, where the user's authorized
    # Wameiji/Xianyu profiles are available. The container only runs the web
    # application and consumes imported snapshots.
    command:
      - sh
      - -c
      - exec cd-monitor web --db $${CD_DB_PATH} --host 0.0.0.0 --port $${SERVER_PORT}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:9890/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s


volumes:
  wameiji_db:
